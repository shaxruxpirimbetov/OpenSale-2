<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenSale — открытый рынок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#EEF1EA;
  --card:#FBFAF5;
  --ink:#1B2420;
  --ink-soft:#5B655C;
  --ink-faint:#8D968A;
  --accent:#DB9A2C;
  --accent-ink:#5C3E0C;
  --teal:#1F6F5C;
  --teal-bg:#E1EEE9;
  --danger:#B3432B;
  --danger-bg:#F5E3DD;
  --line:#CBD0C1;
  --line-strong:#a9b09c;
  --radius:10px;
  --shadow:0 1px 2px rgba(27,36,32,.06), 0 6px 20px -8px rgba(27,36,32,.12);
  --font-display:'Fraunces', serif;
  --font-body:'Inter', system-ui, sans-serif;
  --font-mono:'JetBrains Mono', ui-monospace, monospace;
}
[data-theme="dark"]{
  --paper:#171B16;
  --card:#20261F;
  --ink:#EDEFE6;
  --ink-soft:#B7BDAC;
  --ink-faint:#7C8676;
  --accent:#E6A93A;
  --accent-ink:#FCE2AE;
  --teal:#4FB89B;
  --teal-bg:#193029;
  --danger:#E07358;
  --danger-bg:#3A241C;
  --line:#333B30;
  --line-strong:#4A5442;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 10px 26px -10px rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  background-image:
    radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--ink) 6%, transparent) 1px, transparent 0);
  background-size:22px 22px;
  transition:background .2s ease, color .2s ease;
}
img{max-width:100%;display:block;}
button, input, textarea, select{font-family:inherit; font-size:inherit;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* ============ LAYOUT SHELL ============ */
.wrap{max-width:1180px; margin:0 auto; padding:0 20px;}

header.site{
  position:sticky; top:0; z-index:40;
  background:var(--paper);
  border-bottom:1.5px dashed var(--line-strong);
}
.site-bar{
  display:flex; align-items:center; gap:18px;
  padding:14px 0;
  flex-wrap:wrap;
}
.logo{
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.5rem;
  letter-spacing:-.01em;
  display:flex; align-items:center; gap:8px;
  cursor:pointer;
  white-space:nowrap;
}
.logo .dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--accent);
  display:inline-block;
  box-shadow:0 0 0 3px var(--teal-bg);
}
.site-search{
  flex:1 1 220px;
  display:flex; align-items:center;
  background:var(--card);
  border:1.5px solid var(--line);
  border-radius:999px;
  padding:8px 6px 8px 16px;
  min-width:160px;
}
.site-search input{
  border:none; background:none; outline:none; flex:1;
  color:var(--ink); font-size:.92rem;
}
.site-search input::placeholder{color:var(--ink-faint);}
.site-search button{
  background:var(--ink); color:var(--paper);
  border:none; border-radius:999px;
  width:32px; height:32px; flex-shrink:0;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:transform .15s ease;
}
.site-search button:hover{transform:scale(1.06);}
.nav-actions{display:flex; align-items:center; gap:10px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end;}
.btn{
  font-family:var(--font-body);
  font-weight:600;
  font-size:.88rem;
  border-radius:999px;
  padding:9px 18px;
  border:1.5px solid var(--ink);
  background:transparent;
  color:var(--ink);
  cursor:pointer;
  white-space:nowrap;
  transition:background .15s ease, color .15s ease, transform .1s ease;
}
.btn:hover{background:var(--ink); color:var(--paper);}
.btn:active{transform:scale(.97);}
.btn.primary{
  background:var(--ink); color:var(--paper);
}
.btn.primary:hover{background:var(--teal); border-color:var(--teal); color:#fff;}
.btn.accent{
  background:var(--accent); border-color:var(--accent); color:var(--accent-ink);
}
.btn.accent:hover{background:#c68b25; border-color:#c68b25;}
.btn.ghost{border-color:transparent;}
.btn.ghost:hover{background:var(--card); color:var(--ink);}
.btn.danger{border-color:var(--danger); color:var(--danger);}
.btn.danger:hover{background:var(--danger); color:#fff;}
.btn.small{padding:6px 13px; font-size:.8rem;}
.btn:disabled{opacity:.5; cursor:not-allowed; pointer-events:none;}
.btn.icon-only{
  width:38px; height:38px; padding:0; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}

.userchip{
  display:flex; align-items:center; gap:8px;
  background:var(--card); border:1.5px solid var(--line);
  border-radius:999px; padding:5px 14px 5px 6px;
  cursor:pointer; font-size:.85rem; font-weight:600;
}
.userchip .av{
  width:26px;height:26px;border-radius:50%;
  background:var(--teal); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:.75rem; font-weight:700;
}
.seller-tag{
  font-family:var(--font-mono); font-size:.62rem; font-weight:700;
  letter-spacing:.04em; text-transform:uppercase;
  background:var(--teal-bg); color:var(--teal);
  padding:2px 7px; border-radius:5px;
}

main{min-height:60vh; padding-bottom:70px;}

/* ============ SUB-NAV / STRIP ============ */
.strip{
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; flex-wrap:wrap;
  padding:22px 0 16px;
  border-bottom:1px dashed var(--line);
  margin-bottom:22px;
}
.strip h1{
  font-family:var(--font-display); font-size:1.6rem; font-weight:600;
  margin:0; letter-spacing:-.01em;
}
.strip .count{
  font-family:var(--font-mono); color:var(--ink-faint); font-size:.82rem;
}
.catalog-strip-right{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.catalog-view-switch{
  margin:0; width:auto; min-width:170px; max-width:100%;
}
.catalog-view-switch button{white-space:nowrap;}
.crumb{
  font-family:var(--font-mono); font-size:.78rem; color:var(--ink-faint);
  margin:16px 0 4px;
}
.crumb a{text-decoration:none; border-bottom:1px dotted var(--ink-faint);}
.crumb a:hover{color:var(--ink);}

/* ============ PRODUCT GRID / TAG CARDS ============ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
  gap:20px;
}
.card{
  background:var(--card);
  border:1.5px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  cursor:pointer;
  position:relative;
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  display:flex; flex-direction:column;
}
.card:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--line-strong);}
.card .hole{
  position:absolute; top:10px; left:10px;
  width:14px; height:14px; border-radius:50%;
  background:var(--paper);
  border:1.5px solid var(--line-strong);
  z-index:2;
}
.card .thumb{
  aspect-ratio:4/3; width:100%; overflow:hidden;
  background:repeating-linear-gradient(45deg, #E4E7DD, #E4E7DD 10px, #DEE2D5 10px, #DEE2D5 20px);
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
.card .thumb img{width:100%; height:100%; object-fit:cover;}
.card .thumb .noimg{
  font-family:var(--font-mono); font-size:.7rem; color:var(--ink-faint);
  background:var(--paper); padding:5px 10px; border-radius:6px;
  border:1px dashed var(--line-strong);
}
.card .perf{
  height:0; border-top:1.5px dashed var(--line);
  margin:0 12px;
}
.card .body{padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1;}
.card .title{
  font-weight:600; font-size:.95rem; line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.card .row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto;}
.card .price{
  font-family:var(--font-mono); font-weight:700; font-size:1.05rem;
  color:var(--accent-ink);
  display:flex; align-items:center; gap:6px;
}
.card .price::before{
  content:''; width:9px; height:9px; border-radius:50%;
  background:var(--accent); display:inline-block;
}
.card .seller{
  font-family:var(--font-mono); font-size:.68rem; color:var(--ink-faint);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.card .inactive-badge{
  position:absolute; top:10px; right:10px; z-index:2;
  background:var(--danger); color:#fff;
  font-family:var(--font-mono); font-size:.62rem; font-weight:700;
  padding:3px 8px; border-radius:5px; text-transform:uppercase; letter-spacing:.03em;
}

.load-more{display:flex; justify-content:center; margin-top:32px;}

/* ============ EMPTY / ERROR / LOADING ============ */
.empty, .err{
  text-align:center; padding:60px 20px; color:var(--ink-soft);
}
.empty .big, .err .big{
  font-family:var(--font-display); font-size:1.3rem; color:var(--ink); margin-bottom:6px;
}
.empty p, .err p{font-size:.9rem; max-width:420px; margin:0 auto;}
.err{color:var(--danger);}
.err .big{color:var(--danger);}
.skeleton-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:20px;}
.sk{
  aspect-ratio:4/5.3; border-radius:var(--radius);
  background:linear-gradient(100deg, var(--card) 30%, #f2f0e6 50%, var(--card) 70%);
  background-size:200% 100%;
  animation:shimmer 1.3s infinite;
  border:1.5px solid var(--line);
}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ============ PRODUCT DETAIL ============ */
.detail{
  display:grid; grid-template-columns:1.1fr 1fr; gap:40px;
  align-items:start;
}
@media(max-width:820px){.detail{grid-template-columns:1fr; gap:24px;}}
.gallery-main{
  aspect-ratio:4/3; border-radius:var(--radius); overflow:hidden;
  border:1.5px solid var(--line); background:var(--card);
  display:flex; align-items:center; justify-content:center;
}
.gallery-main img{width:100%; height:100%; object-fit:cover;}
.gallery-thumbs{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.gallery-thumbs img{
  width:60px; height:60px; object-fit:cover; border-radius:7px;
  border:1.5px solid var(--line); cursor:pointer;
}
.gallery-thumbs img.active{border-color:var(--accent);}
.ticket{
  background:var(--card); border:1.5px solid var(--line); border-radius:var(--radius);
  padding:22px 24px;
}
.ticket h2{
  font-family:var(--font-display); font-size:1.7rem; margin:0 0 6px; font-weight:600; line-height:1.2;
}
.ticket .price-big{
  font-family:var(--font-mono); font-weight:700; font-size:1.9rem;
  color:var(--accent-ink); margin:10px 0 16px; display:flex; align-items:center; gap:10px;
}
.ticket .price-big::before{content:''; width:12px;height:12px;border-radius:50%; background:var(--accent);}
.ticket .desc{
  color:var(--ink-soft); font-size:.95rem; line-height:1.65; white-space:pre-wrap;
  border-top:1px dashed var(--line); padding-top:14px; margin-top:6px;
}
.seller-card{
  display:flex; align-items:center; gap:10px;
  margin-top:18px; padding-top:16px; border-top:1px dashed var(--line);
}
.seller-card .av{
  width:38px;height:38px;border-radius:50%; background:var(--teal); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-weight:700; font-size:.9rem; flex-shrink:0;
}
.seller-card .who{font-size:.85rem; line-height:1.35;}
.seller-card .who b{cursor:pointer;}
.seller-card .who b:hover{text-decoration:underline;}
.seller-card .who span{color:var(--ink-faint); font-family:var(--font-mono); font-size:.72rem;}
.meta-row{
  display:flex; gap:16px; flex-wrap:wrap; margin-top:16px;
  font-family:var(--font-mono); font-size:.72rem; color:var(--ink-faint);
}
.owner-actions{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;}

/* ============ FORMS ============ */
.form-shell{max-width:560px; margin:0 auto;}
.form-shell.wide{max-width:640px;}
.field{margin-bottom:16px;}
.field label{
  display:block; font-weight:600; font-size:.82rem; margin-bottom:6px; color:var(--ink);
}
.field .hint{font-size:.76rem; color:var(--ink-faint); margin-top:5px;}
.field input[type=text], .field input[type=email], .field input[type=password], .field input[type=number], .field textarea{
  width:100%; padding:11px 13px; border-radius:8px;
  border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  outline:none; transition:border-color .15s ease;
}
.field input:focus, .field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical; min-height:110px; font-family:var(--font-body);}
.check-row{display:flex; align-items:center; gap:9px; font-size:.88rem;}
.check-row input{width:17px; height:17px; accent-color:var(--teal);}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:520px){.two-col{grid-template-columns:1fr;}}
.form-actions{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
.tabbar{display:flex; gap:4px; background:var(--paper); border:1.5px solid var(--line); border-radius:999px; padding:4px; margin-bottom:22px;}
.tabbar button{
  flex:1; border:none; background:transparent; padding:9px 0; border-radius:999px;
  font-weight:600; font-size:.85rem; cursor:pointer; color:var(--ink-soft);
}
.tabbar button.active{background:var(--ink); color:var(--paper);}

.dropzone{
  border:1.5px dashed var(--line-strong); border-radius:var(--radius);
  padding:26px; text-align:center; cursor:pointer;
  background:var(--card); transition:border-color .15s ease, background .15s ease;
}
.dropzone:hover, .dropzone.drag{border-color:var(--accent); background:#FBF3E2;}
.dropzone .icon{font-size:1.5rem; margin-bottom:6px;}
.dropzone p{margin:0; font-size:.85rem; color:var(--ink-soft);}
.dropzone .sub{font-size:.72rem; color:var(--ink-faint); margin-top:4px; font-family:var(--font-mono);}
.preview-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;}
.preview-row .thumb{
  width:74px; height:74px; border-radius:8px; overflow:hidden; position:relative;
  border:1.5px solid var(--line);
}
.preview-row .thumb img{width:100%; height:100%; object-fit:cover;}
.preview-row .thumb .rm{
  position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%;
  background:rgba(27,36,32,.75); color:#fff; border:none; cursor:pointer;
  font-size:.7rem; line-height:1; display:flex; align-items:center; justify-content:center;
}

.banner{
  border-radius:var(--radius); padding:14px 18px; font-size:.85rem; margin-bottom:18px;
  display:flex; align-items:flex-start; gap:10px; line-height:1.5;
}
.banner.info{background:var(--teal-bg); color:#12463a; border:1px solid #b9d9cd;}
.banner.warn{background:#FBF3E2; color:var(--accent-ink); border:1px solid #ecd7ab;}
.banner.error{background:var(--danger-bg); color:var(--danger); border:1px solid #e3bfae;}

/* ============ MODAL (auth) ============ */
.modal-back{
  position:fixed; inset:0; background:rgba(27,36,32,.42);
  display:flex; align-items:center; justify-content:center; z-index:5000;
  padding:16px; backdrop-filter:blur(1px);
}
.modal{
  background:var(--paper); border-radius:14px; border:1.5px solid var(--line);
  max-width:420px; width:100%; padding:26px 26px 24px;
  box-shadow:0 20px 60px -12px rgba(0,0,0,.35);
  max-height:90vh; overflow-y:auto;
}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-head h3{font-family:var(--font-display); font-size:1.3rem; margin:0;}
.modal-close{background:none; border:none; cursor:pointer; font-size:1.2rem; color:var(--ink-faint); line-height:1; padding:4px;}

/* ============ TOASTS ============ */
.toasts{position:fixed; bottom:18px; right:18px; z-index:5100; display:flex; flex-direction:column; gap:10px; max-width:320px;}
.toast{
  background:var(--ink); color:var(--paper); padding:12px 16px; border-radius:9px;
  font-size:.85rem; box-shadow:var(--shadow); animation:rise .18s ease;
}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--teal);}
@keyframes rise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ============ PROFILE ============ */
.profile-head{display:flex; align-items:center; gap:16px; margin-bottom:26px; flex-wrap:wrap;}
.profile-head .av{
  width:64px;height:64px;border-radius:50%; background:var(--teal); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-weight:700; font-size:1.4rem; flex-shrink:0;
}
.profile-head h1{font-family:var(--font-display); margin:0 0 4px; font-size:1.5rem;}
.profile-head .sub{color:var(--ink-faint); font-family:var(--font-mono); font-size:.78rem;}

footer.site{
  border-top:1.5px dashed var(--line-strong); padding:22px 0; margin-top:40px;
  font-family:var(--font-mono); font-size:.72rem; color:var(--ink-faint);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
}

/* settings panel (profile shortcut + theme) */
.settings-panel{
  position:absolute; right:0; top:calc(100% + 8px); background:var(--paper);
  border:1.5px solid var(--line); border-radius:12px; padding:16px; width:250px;
  box-shadow:var(--shadow); z-index:50;
}
.settings-wrap{position:relative;}
.settings-panel .s-title{
  font-family:var(--font-display); font-weight:600; font-size:1.02rem; margin:0 0 12px;
}
.settings-panel .s-label{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin:0 0 8px;}
.theme-switch{
  display:flex; gap:4px; background:var(--card); border:1.5px solid var(--line);
  border-radius:999px; padding:3px; margin-bottom:14px;
}
.theme-switch button{
  flex:1; border:none; background:transparent; padding:7px 0; border-radius:999px;
  font-weight:600; font-size:.78rem; cursor:pointer; color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center; gap:5px;
}
.theme-switch button.active{background:var(--ink); color:var(--paper);}
.settings-panel .sp-divider{border-top:1px dashed var(--line); margin:12px 0;}
.settings-panel .btn{width:100%;}
.settings-panel .sp-hint{font-size:.76rem; color:var(--ink-faint); margin:0 0 8px; line-height:1.4;}

.spinner{
  width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff; animation:spin .7s linear infinite; display:inline-block; vertical-align:-3px;
}
@keyframes spin{to{transform:rotate(360deg);}}

.map-field{margin-bottom:16px;}
.map-picker{
  height:240px; width:100%; border-radius:var(--radius);
  border:1.5px solid var(--line); overflow:hidden; background:var(--card);
  position:relative; isolation:isolate; z-index:0;
}
.catalog-map{
  height:560px; width:100%; border-radius:var(--radius);
  border:1.5px solid var(--line); overflow:hidden; background:var(--card);
  position:relative; isolation:isolate; z-index:0;
}
.map-legend{
  font-family:var(--font-mono); font-size:.76rem; color:var(--ink-faint);
  margin-top:10px;
}
.map-hint{font-size:.76rem; color:var(--ink-faint); margin-top:6px;}
.coord-readout{
  font-family:var(--font-mono); font-size:.76rem; color:var(--ink-soft);
  margin-top:6px; display:flex; align-items:center; gap:6px;
}
.coord-readout .dotstate{width:7px; height:7px; border-radius:50%; background:var(--line-strong); display:inline-block;}
.coord-readout.set .dotstate{background:var(--teal);}
.map-pin-el{
  width:18px; height:18px; border-radius:50%;
  background:var(--accent); border:2.5px solid var(--card);
  box-shadow:0 0 0 1.5px var(--accent-ink), 0 2px 6px rgba(0,0,0,.35);
  cursor:pointer;
}
.map-toggle-row{margin:14px 0 2px;}

<script>
(function(){
"use strict";

/* ============================================================
   STATE & CONFIG
============================================================ */
// Backend URL — change this constant in the source to point at your
// deployment. Intentionally not user-configurable from the UI.
const API_BASE_URL = "https://open-sale-2.vercel.app";

const LS_ACCESS = "os_access";
const LS_REFRESH = "os_refresh";
const LS_UNAME = "os_username";
const LS_THEME = "os_theme";

const state = {
  apiBase: API_BASE_URL.replace(/\/$/,""),
  access: localStorage.getItem(LS_ACCESS) || null,
  refresh: localStorage.getItem(LS_REFRESH) || null,
  username: localStorage.getItem(LS_UNAME) || null,
  me: null, // profile object of logged-in user, fetched lazily
};

function isLoggedIn(){ return !!state.access; }

function saveAuth(access, refresh, username){
  state.access = access; state.refresh = refresh; state.username = username;
  if(access) localStorage.setItem(LS_ACCESS, access); else localStorage.removeItem(LS_ACCESS);
  if(refresh) localStorage.setItem(LS_REFRESH, refresh); else localStorage.removeItem(LS_REFRESH);
  if(username) localStorage.setItem(LS_UNAME, username); else localStorage.removeItem(LS_UNAME);
}
function logout(){
  saveAuth(null, null, null);
  state.me = null;
  renderNav();
  navigate("catalog");
  toast("Вы вышли из аккаунта", "ok");
}

/* ============================================================
   API HELPERS
============================================================ */
async function apiFetch(path, opts={}, retry=true){
  const url = path.startsWith("http") ? path : state.apiBase.replace(/\/$/,"") + path;
  const headers = opts.headers ? {...opts.headers} : {};
  if(state.access) headers["Authorization"] = "Bearer " + state.access;
  let res;
  try{
    res = await fetch(url, {...opts, headers});
  }catch(e){
    throw new ApiError("Не удалось подключиться к " + state.apiBase + ". Проверьте, что бэкенд запущен и адрес API_BASE_URL в коде указан верно.", 0);
  }
  if(res.status === 401 && retry && state.refresh){
    const refreshed = await tryRefresh();
    if(refreshed) return apiFetch(path, opts, false);
    logout();
    throw new ApiError("Сессия истекла. Войдите снова.", 401);
  }
  if(!res.ok){
    let body = null;
    try{ body = await res.json(); }catch(e){}
    throw new ApiError(extractError(body, res.status), res.status, body);
  }
  if(res.status === 204) return null;
  try{ return await res.json(); }catch(e){ return null; }
}

function extractError(body, status){
  if(!body) return "Ошибка запроса (" + status + ")";
  if(typeof body === "string") return body;
  if(body.detail) return body.detail;
  const parts = [];
  for(const k in body){
    const v = body[k];
    parts.push((k!=="non_field_errors" ? k+": " : "") + (Array.isArray(v)?v.join(" "):v));
  }
  return parts.length ? parts.join(" · ") : "Ошибка запроса (" + status + ")";
}

class ApiError extends Error{
  constructor(msg, status, body){ super(msg); this.status = status; this.body = body; }
}

async function tryRefresh(){
  try{
    const res = await fetch(state.apiBase.replace(/\/$/,"") + "/api/refresh/", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({refresh: state.refresh})
    });
    if(!res.ok) return false;
    const data = await res.json();
    state.access = data.access;
    localStorage.setItem(LS_ACCESS, data.access);
    return true;
  }catch(e){ return false; }
}

async function fetchMe(){
  if(!state.username) return null;
  if(state.me && state.me.username === state.username) return state.me;
  try{
    const data = await apiFetch("/api/user/" + encodeURIComponent(state.username) + "/");
    state.me = data;
    return data;
  }catch(e){ return null; }
}

/* ============================================================
   ROUTER
============================================================ */
const app = document.getElementById("app");

function navigate(view, params={}, push=true){
  const hash = "#/" + view + (params.id ? "/" + params.id : "") + (params.q ? "?q="+encodeURIComponent(params.q) : "");
  if(push) history.pushState({view, params}, "", hash);
  render(view, params);
  window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
}

window.addEventListener("popstate", (e)=>{
  const r = parseHash();
  render(r.view, r.params);
});

function parseHash(){
  const h = location.hash.replace(/^#\//,"");
  const [pathPart, queryPart] = h.split("?");
  const segs = pathPart.split("/").filter(Boolean);
  const params = {};
  if(queryPart){
    const q = new URLSearchParams(queryPart);
    if(q.get("q")) params.q = q.get("q");
  }
  let view = segs[0] || "catalog";
  if(segs[1]) params.id = segs[1];
  return {view, params};
}

function render(view, params){
  closeSettings();
  switch(view){
    case "catalog": return renderCatalog(params.q||"");
    case "product": return renderProductDetail(params.id);
    case "sell": return renderSellForm(params.id);
    case "profile": return renderProfile(params.id || state.username);
    default: return renderCatalog();
  }
}

/* ============================================================
   TOASTS
============================================================ */
function toast(msg, kind="ok"){
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast " + (kind==="err"?"err":"ok");
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .25s"; setTimeout(()=>el.remove(), 260); }, 3200);
}

/* ============================================================
   NAV BAR RENDER
============================================================ */
function renderNav(){
  const el = document.getElementById("navActions");
  if(isLoggedIn()){
    el.innerHTML = `
      <button class="btn accent small" id="navSell">+ Разместить</button>
      <div class="userchip" id="navUser">
        <span class="av">${escapeHtml((state.username||"?").slice(0,2).toUpperCase())}</span>
        <span>${escapeHtml(state.username)}</span>
      </div>
      <button class="btn ghost small" id="navLogout">Выйти</button>
    `;
    document.getElementById("navSell").onclick = ()=> navigate("sell");
    document.getElementById("navUser").onclick = ()=> navigate("profile", {id:state.username});
    document.getElementById("navLogout").onclick = logout;
  }else{
    el.innerHTML = `
      <button class="btn ghost small" id="navLogin">Войти</button>
      <button class="btn primary small" id="navRegister">Регистрация</button>
    `;
    document.getElementById("navLogin").onclick = ()=> openAuthModal("login");
    document.getElementById("navRegister").onclick = ()=> openAuthModal("register");
  }
}

document.querySelector('[data-nav="catalog"]').addEventListener("click", ()=>navigate("catalog"));

/* ============================================================
   SETTINGS PANEL — theme switch + profile shortcut
============================================================ */
const settingsBtn = document.getElementById("settingsBtn");
const settingsPanel = document.getElementById("settingsPanel");

settingsBtn.addEventListener("click", (e)=>{
  e.stopPropagation();
  const willOpen = settingsPanel.classList.contains("hidden");
  settingsPanel.classList.toggle("hidden");
  if(willOpen) renderSettingsPanel();
});
document.addEventListener("click", (e)=>{
  if(!settingsPanel.contains(e.target) && e.target !== settingsBtn) settingsPanel.classList.add("hidden");
});
function closeSettings(){ settingsPanel.classList.add("hidden"); }

function renderSettingsPanel(){
  document.querySelectorAll("#themeSwitch [data-theme-btn]").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.themeBtn === getTheme());
    btn.onclick = ()=> setTheme(btn.dataset.themeBtn);
  });
  const slot = document.getElementById("settingsProfileSlot");
  if(isLoggedIn()){
    slot.innerHTML = `<button class="btn primary small" id="settingsProfileBtn">Редактировать профиль</button>`;
    document.getElementById("settingsProfileBtn").onclick = ()=>{
      closeSettings();
      navigate("profile", {id: state.username});
    };
  }else{
    slot.innerHTML = `
      <div class="sp-hint">Войдите, чтобы редактировать профиль.</div>
      <button class="btn small" id="settingsLoginBtn">Войти</button>
    `;
    document.getElementById("settingsLoginBtn").onclick = ()=>{
      closeSettings();
      openAuthModal("login");
    };
  }
}

/* ============================================================
   THEME
============================================================ */
function getTheme(){
  return localStorage.getItem(LS_THEME) || "light";
}
function applyTheme(theme){
  if(theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
  else document.documentElement.removeAttribute("data-theme");
}
function setTheme(theme){
  localStorage.setItem(LS_THEME, theme);
  applyTheme(theme);
  document.querySelectorAll("#themeSwitch [data-theme-btn]").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.themeBtn === theme);
  });
}
applyTheme(getTheme());

document.getElementById("searchForm").addEventListener("submit", (e)=>{
  e.preventDefault();
  const q = document.getElementById("searchInput").value.trim();
  navigate("catalog", {q});
});

/* ============================================================
   UTIL
============================================================ */
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtPrice(p){
  const n = Number(p);
  if(isNaN(n)) return escapeHtml(p);
  return n.toLocaleString("ru-RU");
}
function fmtDate(s){
  try{
    const d = new Date(s);
    return d.toLocaleDateString("ru-RU", {day:"numeric", month:"short", year:"numeric"});
  }catch(e){ return s; }
}
function initials(u){ return (u||"?").slice(0,2).toUpperCase(); }
function imgUrl(u){
  if(!u) return "";
  if(/^https?:\/\//.test(u)) return u;
  return state.apiBase.replace(/\/$/,"") + (u.startsWith("/")?u:"/"+u);
}

/* ============================================================
   CATALOG VIEW — client picks List or Map via a segmented switch
============================================================ */
let catalogNextUrl = null;
let catalogMapInstance = null;
const LS_CATALOG_VIEW = "os_catalog_view";
function getCatalogView(){ return localStorage.getItem(LS_CATALOG_VIEW) === "map" ? "map" : "list"; }
function setCatalogView(v){ localStorage.setItem(LS_CATALOG_VIEW, v); }

async function renderCatalog(q=""){
  const view = getCatalogView();
  app.innerHTML = `
    <div class="strip">
      <h1>${q ? "Результаты: «"+escapeHtml(q)+"»" : "Каталог товаров"}</h1>
      <div class="catalog-strip-right">
        <span class="count" id="catCount"></span>
        <div class="theme-switch catalog-view-switch" id="catalogViewSwitch">
          <button data-cv="list">☰ Список</button>
          <button data-cv="map">📍 Карта</button>
        </div>
      </div>
    </div>
    <div id="catalogContent"></div>
  `;
  document.querySelectorAll("#catalogViewSwitch [data-cv]").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.cv === view);
    btn.onclick = ()=>{
      if(btn.dataset.cv === getCatalogView()) return;
      setCatalogView(btn.dataset.cv);
      document.querySelectorAll("#catalogViewSwitch [data-cv]").forEach(b=> b.classList.toggle("active", b === btn));
      renderCatalogBody(q);
    };
  });
  renderCatalogBody(q);
}

function renderCatalogBody(q){
  if(catalogMapInstance){ try{ catalogMapInstance.remove(); }catch(e){} catalogMapInstance = null; }
  const content = document.getElementById("catalogContent");
  if(getCatalogView() === "map"){
    content.innerHTML = `
      <div class="catalog-map" id="catalogMap"></div>
      <div class="map-legend" id="mapLegend"></div>
    `;
    loadProductsForMap(q);
  }else{
    content.innerHTML = `
      <div class="skeleton-grid" id="grid">
        ${Array.from({length:8}).map(()=>'<div class="sk"></div>').join("")}
      </div>
      <div class="load-more hidden" id="loadMoreWrap"><button class="btn" id="loadMoreBtn">Показать ещё</button></div>
    `;
    loadProducts(q, false);
  }
}

async function loadProducts(q, append){
  const grid = document.getElementById("grid");
  const loadWrap = document.getElementById("loadMoreWrap");
  try{
    let url;
    if(append && catalogNextUrl){
      url = catalogNextUrl;
    }else{
      url = "/api/product/" + (q ? "?search="+encodeURIComponent(q) : "");
    }
    const data = await apiFetch(url);
    let results = Array.isArray(data) ? data : (data.results || []);
    catalogNextUrl = Array.isArray(data) ? null : data.next;

    // client-side filter fallback in case backend has no search filter configured
    if(q && Array.isArray(data) === false && data.results){
      const qq = q.toLowerCase();
      const matched = results.some(p=>true); // trust server results primarily
    }
    if(q){
      results = results.filter(p => (p.title||"").toLowerCase().includes(q.toLowerCase()) || (p.description||"").toLowerCase().includes(q.toLowerCase()));
    }

    if(!append){
      grid.innerHTML = "";
    }
    if(results.length === 0 && !append){
      grid.className = "";
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">
        <div class="big">${q ? "Ничего не найдено" : "Пока пусто"}</div>
        <p>${q ? "Попробуйте другой запрос." : "Здесь появятся товары, как только продавцы начнут их размещать."}</p>
      </div>`;
      loadWrap.classList.add("hidden");
      document.getElementById("catCount").textContent = "";
      return;
    }
    grid.className = "grid";
    for(const p of results){ grid.appendChild(productCard(p)); }
    const count = Array.isArray(data) ? results.length : data.count;
    document.getElementById("catCount").textContent = (count!=null ? count + " объявлени" + pluralRu(count) : "");
    loadWrap.classList.toggle("hidden", !catalogNextUrl || !!q);
  }catch(e){
    grid.className = "";
    grid.innerHTML = `<div class="err" style="grid-column:1/-1;">
      <div class="big">Не получилось загрузить каталог</div>
      <p>${escapeHtml(e.message)}</p>
    </div>`;
    loadWrap.classList.add("hidden");
  }
}
function pluralRu(n){
  n = Math.abs(n)%100;
  const n1 = n%10;
  if(n>10 && n<20) return "й";
  if(n1>1 && n1<5) return "я";
  if(n1===1) return "е";
  return "й";
}

async function loadProductsForMap(q){
  const mapEl = document.getElementById("catalogMap");
  const legend = document.getElementById("mapLegend");
  mapEl.innerHTML = `<div class="empty" style="padding:40px 0;"><div class="big">Загружаем карту…</div></div>`;
  try{
    const all = [];
    let next = "/api/product/";
    let guard = 0;
    while(next && guard < 15){
      const data = await apiFetch(next);
      const results = Array.isArray(data) ? data : data.results;
      all.push(...results);
      next = Array.isArray(data) ? null : data.next;
      guard++;
    }
    let list = all;
    if(q){
      const qq = q.toLowerCase();
      list = list.filter(p => (p.title||"").toLowerCase().includes(qq) || (p.description||"").toLowerCase().includes(qq));
    }
    const located = list.filter(p => p.user && (p.user.latitude || p.user.longitude) && (p.user.latitude !== 0 || p.user.longitude !== 0));
    const unlocated = list.length - located.length;

    mapEl.innerHTML = "";
    if(list.length === 0){
      mapEl.innerHTML = `<div class="empty" style="padding:40px 0;">
        <div class="big">${q ? "Ничего не найдено" : "Пока пусто"}</div>
        <p>${q ? "Попробуйте другой запрос." : "Здесь появятся товары, как только продавцы начнут их размещать."}</p>
      </div>`;
      legend.innerHTML = "";
      return;
    }

    const map = L.map(mapEl, {attributionControl:true}).setView(DEFAULT_MAP_CENTER, 12);
    catalogMapInstance = map;
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19, attribution:'&copy; OpenStreetMap'
    }).addTo(map);

    const pinIcon = L.divIcon({className:'', html:'<div class="map-pin-el"></div>', iconSize:[18,18], iconAnchor:[9,9]});

    // group products by seller — one marker per shop, popup lists up to 3 items
    const groups = {};
    for(const p of located){
      const key = p.user.username;
      if(!groups[key]) groups[key] = {lat:p.user.latitude, lng:p.user.longitude, user:p.user, products:[]};
      groups[key].products.push(p);
    }

    const bounds = [];
    for(const key in groups){
      const g = groups[key];
      const marker = L.marker([g.lat, g.lng], {icon:pinIcon}).addTo(map);
      const shown = g.products.slice(0, 3);
      const extra = g.products.length - shown.length;
      const itemsHtml = shown.map(p=>{
        const img = p.product_image && p.product_image.length ? p.product_image[0].image : null;
        return `
          <div class="map-popup-item" data-pid="${p.id}">
            <div class="map-popup-item-thumb">${img ? `<img src="${imgUrl(img)}" alt="">` : `<span class="noimg">📦</span>`}</div>
            <div class="map-popup-item-info">
              <div class="map-popup-item-title">${escapeHtml(p.title)}</div>
              <div class="map-popup-item-price">${fmtPrice(p.price)}</div>
            </div>
          </div>
        `;
      }).join("");
      marker.bindPopup(`
        <div class="map-popup">
          <div class="map-popup-seller">@${escapeHtml(g.user.username)} · ${g.products.length} товар${pluralGoodsRu(g.products.length)}</div>
          <div class="map-popup-items">${itemsHtml}</div>
          ${extra > 0
            ? `<button class="btn small map-popup-more">Показать ещё ${extra}</button>`
            : (g.products.length > 1 ? `<button class="btn ghost small map-popup-more">Все объявления продавца</button>` : "")}
        </div>
      `, {maxWidth: 230});
      marker.on('popupopen', (e)=>{
        const root = e.popup.getElement();
        root.querySelectorAll(".map-popup-item").forEach(el=>{
          el.onclick = ()=> navigate("product", {id: Number(el.dataset.pid)});
        });
        const moreBtn = root.querySelector(".map-popup-more");
        if(moreBtn) moreBtn.onclick = ()=> navigate("profile", {id: g.user.username});
      });
      bounds.push([g.lat, g.lng]);
    }
    if(bounds.length){
      map.fitBounds(bounds, {padding:[36,36], maxZoom:14});
    }
    setTimeout(()=> map.invalidateSize(), 150);

    legend.innerHTML = unlocated > 0
      ? `${located.length} из ${list.length} показаны на карте (${Object.keys(groups).length} продавц${pluralSellersRu(Object.keys(groups).length)}) — у ${unlocated} без указанного местоположения.`
      : `На карте ${Object.keys(groups).length} продавц${pluralSellersRu(Object.keys(groups).length)}, ${located.length} товар${pluralGoodsRu(located.length)}.`;
  }catch(e){
    mapEl.innerHTML = `<div class="err" style="padding:40px 0;"><div class="big">Не получилось загрузить карту</div><p>${escapeHtml(e.message)}</p></div>`;
    legend.innerHTML = "";
  }
}
function pluralSellersRu(n){
  n = Math.abs(n)%100;
  const n1 = n%10;
  if(n>10 && n<20) return "ев";
  if(n1===1) return "а";
  if(n1>1 && n1<5) return "ев";
  return "ев";
}
function pluralGoodsRu(n){
  n = Math.abs(n)%100;
  const n1 = n%10;
  if(n>10 && n<20) return "ов";
  if(n1===1) return "";
  if(n1>1 && n1<5) return "а";
  return "ов";
}

/* ============================================================
   LOCATION MAP PICKER
   Used on registration (seller signup) and profile (enabling seller mode).
   Returns a controller {getLatLng(), destroy()} and reports changes via onChange.
============================================================ */
const DEFAULT_MAP_CENTER = [42.4667, 59.6167]; // Nukus — default fallback for the region

function createMapPicker(containerId, readoutId, initialLat, initialLng, onChange){
  const hasInitial = !!(initialLat && (initialLat !== 0 || initialLng !== 0));
  const map = L.map(containerId, {attributionControl:true, zoomControl:true})
    .setView(hasInitial ? [initialLat, initialLng] : DEFAULT_MAP_CENTER, hasInitial ? 13 : 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'&copy; OpenStreetMap'
  }).addTo(map);

  const pinIcon = L.divIcon({className:'', html:'<div class="map-pin-el"></div>', iconSize:[18,18], iconAnchor:[9,9]});
  let marker = null;
  let current = hasInitial ? {lat:initialLat, lng:initialLng} : null;

  function updateReadout(){
    const el = document.getElementById(readoutId);
    if(!el) return;
    if(current){
      el.innerHTML = `<span class="dotstate"></span> ${current.lat.toFixed(6)}, ${current.lng.toFixed(6)}`;
      el.classList.add("set");
    }else{
      el.innerHTML = `<span class="dotstate"></span> Местоположение не выбрано`;
      el.classList.remove("set");
    }
  }

  function setPoint(lat, lng){
    current = {lat, lng};
    if(marker) marker.setLatLng([lat,lng]);
    else{
      marker = L.marker([lat,lng], {icon:pinIcon, draggable:true}).addTo(map);
      marker.on('drag', (e)=>{ const p = e.target.getLatLng(); current = {lat:p.lat, lng:p.lng}; updateReadout(); if(onChange) onChange(current); });
    }
    updateReadout();
    if(onChange) onChange(current);
  }

  if(hasInitial) setPoint(initialLat, initialLng);
  else updateReadout();

  map.on('click', (e)=> setPoint(e.latlng.lat, e.latlng.lng));

  if(!hasInitial && navigator.geolocation){
    navigator.geolocation.getCurrentPosition((pos)=>{
      map.setView([pos.coords.latitude, pos.coords.longitude], 12);
    }, ()=>{}, {timeout:4000});
  }

  setTimeout(()=> map.invalidateSize(), 150);

  return {
    getLatLng: ()=> current,
    invalidate: ()=> map.invalidateSize(),
    destroy: ()=> map.remove()
  };
}

function locationFieldMarkup(mapId, readoutId){
  return `
    <div class="map-field">

      <div class="map-hint">Нажмите на карту или перетащите метку — это поможет покупателям находить товары рядом.</div>

function openAuthModal(tab="login"){
  regMapPicker = null;
  regLocation = null;
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-back" id="modalBack">
      <div class="modal">

          <button id="tabRegister" class="${tab==='register'?'active':''}">Регистрация</button>
        </div>
        <div id="authBody"></div>
      </div>
    </div>
  `;
  document.getElementById("modalClose").onclick = closeModal;

function closeModal(){
  if(regMapPicker){ try{ regMapPicker.destroy(); }catch(e){} regMapPicker = null; }
  regLocation = null;
  document.getElementById("modalRoot").innerHTML = "";
}

function renderAuthTab(tab){
  document.getElementById("tabLogin").classList.toggle("active", tab==="login");
  document.getElementById("tabRegister").classList.toggle("active", tab==="register");
  const body = document.getElementById("authBody");
  if(tab==="login"){
    body.innerHTML = `
      <div class="field"><label>Логин</label><input type="text" id="loginUsername" autocomplete="username"></div>
      <div class="field"><label>Пароль</label><input type="password" id="loginPassword" autocomplete="current-password"></div>
      <div id="loginErr"></div>
      <div class="form-actions"><button class="btn primary" id="loginSubmit" style="flex:1;">Войти</button></div>
    `;
    document.getElementById("loginSubmit").onclick = doLogin;
    body.querySelectorAll("input").forEach(i=> i.addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); }));
  }else{
    body.innerHTML = `
      <div class="field"><label>Логин</label><input type="text" id="regUsername" autocomplete="username"></div>
      <div class="two-col">
        <div class="field"><label>Имя</label><input type="text" id="regFirst"></div>
        <div class="field"><label>Фамилия</label><input type="text" id="regLast"></div>
      </div>
      <div class="field"><label>Email <span style="font-weight:400; color:var(--ink-faint);">(необязательно)</span></label><input type="email" id="regEmail"></div>
      <div class="field"><label>Пароль</label><input type="password" id="regPassword" autocomplete="new-password"></div>
      <div class="field"><label class="check-row"><input type="checkbox" id="regSeller"> Хочу продавать товары</label></div>
      <div id="regLocationWrap" class="hidden">${locationFieldMarkup("regMap", "regCoordReadout")}</div>
      <div id="regErr"></div>
      <div class="form-actions"><button class="btn primary" id="regSubmit" style="flex:1;">Создать аккаунт</button></div>
    `;
    document.getElementById("regSubmit").onclick = doRegister;
    const sellerCheck = document.getElementById("regSeller");
    const locWrap = document.getElementById("regLocationWrap");
    sellerCheck.addEventListener("change", ()=>{
      locWrap.classList.toggle("hidden", !sellerCheck.checked);
      if(sellerCheck.checked){
        if(regMapPicker) regMapPicker.invalidate();
        else regMapPicker = createMapPicker("regMap", "regCoordReadout", 0, 0, (p)=>{ regLocation = p; });
      }
    });
  }
}
let regMapPicker = null;
let regLocation = null;

async function doLogin(){
  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errBox = document.getElementById("loginErr");
  errBox.innerHTML = "";
  if(!username || !password){ errBox.innerHTML = `<div class="banner error">Введите логин и пароль.</div>`; return; }
  const btn = document.getElementById("loginSubmit");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try{
    const data = await apiFetch("/api/token/", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({username, password})});
    saveAuth(data.access, data.refresh, username);
    state.me = null;
    closeModal();
    renderNav();
    toast("С возвращением, "+username+"!", "ok");
    navigate("catalog");
  }catch(e){
    errBox.innerHTML = `<div class="banner error">${escapeHtml(e.status===401 ? "Неверный логин или пароль." : e.message)}</div>`;
  }finally{
    btn.disabled = false; btn.textContent = "Войти";
  }
}

async function doRegister(){
  const username = document.getElementById("regUsername").value.trim();
  const first_name = document.getElementById("regFirst").value.trim();
  const last_name = document.getElementById("regLast").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  const password = document.getElementById("regPassword").value;
  const is_seller = document.getElementById("regSeller").checked;
  const errBox = document.getElementById("regErr");
  errBox.innerHTML = "";
  if(!username || !password){ errBox.innerHTML = `<div class="banner error">Логин и пароль обязательны.</div>`; return; }
  if(is_seller && !regLocation){ errBox.innerHTML = `<div class="banner error">Укажите местоположение на карте — это нужно для аккаунта продавца.</div>`; return; }
  const btn = document.getElementById("regSubmit");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try{
    const payload = {username, password, is_seller};
    if(first_name) payload.first_name = first_name;
    if(last_name) payload.last_name = last_name;
    if(email) payload.email = email;
    if(is_seller && regLocation){ payload.latitude = regLocation.lat; payload.longitude = regLocation.lng; }
    await apiFetch("/api/user/", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
    const data = await apiFetch("/api/token/", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({username, password})});
    saveAuth(data.access, data.refresh, username);
    state.me = null;
    closeModal();
    renderNav();
    toast("Аккаунт создан. Добро пожаловать, "+username+"!", "ok");
    navigate("catalog");
  }catch(e){
    errBox.innerHTML = `<div class="banner error">${escapeHtml(e.message)}</div>`;
  }finally{
    btn.disabled = false; btn.textContent = "Создать аккаунт";
  }
}

function addFiles(fileList){
  for(const f of fileList){ if(f.type.startsWith("image/")) selectedFiles.push(f); }
  renderPreviews();
}
function renderPreviews(){
  const row = document.getElementById("previewRow");
  if(!row) return;
  row.innerHTML = "";
  selectedFiles.forEach((f, i)=>{
    const div = document.createElement("div");
    div.className = "thumb";
    div.innerHTML = `<img src="${URL.createObjectURL(f)}"><button class="rm" data-i="${i}">✕</button>`;
    div.querySelector(".rm").onclick = ()=>{ selectedFiles.splice(i,1); renderPreviews(); };
    row.appendChild(div);
  });
}

    if(editingProduct){
      const updated = await apiFetch("/api/product/"+editingProduct.id+"/", {
        method:"PATCH", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({title, description, price})
      });
      toast("Изменения сохранены", "ok");
      navigate("product", {id: updated.id});
    }else{
      const fd = new FormData();
      fd.append("title", title);
      fd.append("description", description);
      fd.append("price", price);
      selectedFiles.forEach(f=> fd.append("images", f));
      const created = await apiFetch("/api/product/", {method:"POST", body: fd});
      toast("Объявление опубликовано", "ok");
      navigate("product", {id: created.id});
    }
  }catch(e){
    errBox.innerHTML = `<div class="banner error">${escapeHtml(e.message)}</div>`;
  }finally{
    btn.disabled = false; btn.textContent = editingProduct ? "Сохранить изменения" : "Опубликовать";
  }
}

/* ============================================================
   PROFILE VIEW
============================================================ */
async function renderProfile(username){
  if(!username){
    app.innerHTML = `<div class="empty"><div class="big">Профиль недоступен</div><p>Войдите в аккаунт, чтобы видеть профиль.</p></div>`;
    return;
  }
  app.innerHTML = `<div class="skeleton-grid"><div class="sk" style="aspect-ratio:3/1;"></div></div>`;
  try{
    const u = await apiFetch("/api/user/" + encodeURIComponent(username) + "/");
    const isMe = isLoggedIn() && state.username === u.username;
    app.innerHTML = `
      <div class="profile-head">
        <span class="av">${initials(u.username)}</span>
        <div>
          <h1>${escapeHtml(((u.first_name||"")+" "+(u.last_name||"")).trim() || u.username)} ${u.is_seller?'<span class="seller-tag" style="margin-left:6px;">продавец</span>':''}</h1>
          <div class="sub">@${escapeHtml(u.username)}${u.date_joined ? " · на площадке с "+fmtDate(u.date_joined) : ""}</div>
        </div>
      </div>
      ${isMe ? `
      <div class="tabbar" style="max-width:420px;">
        <button id="pTabInfo" class="active">Профиль</button>
        <button id="pTabListings">Мои объявления</button>
      </div>
      <div id="profileBody"></div>
      ` : `
      <div class="strip"><h1>Объявления @${escapeHtml(u.username)}</h1></div>
      <div class="grid" id="userListings"></div>
      `}
    `;
    if(isMe){
      renderProfileInfoTab(u);
      document.getElementById("pTabInfo").onclick = ()=>{
        setPTab("pTabInfo"); renderProfileInfoTab(u);
      };
      document.getElementById("pTabListings").onclick = ()=>{
        if(profileMapPicker){ try{ profileMapPicker.destroy(); }catch(e){} profileMapPicker = null; }
        setPTab("pTabListings"); renderProfileListingsTab(u.username, true);
      };
    }else{
      loadUserListings(u.username, "userListings", false);
    }
  }catch(e){
    app.innerHTML = `<div class="err"><div class="big">Профиль не найден</div><p>${escapeHtml(e.message)}</p></div>`;
  }
}
function setPTab(id){
  document.getElementById("pTabInfo").classList.toggle("active", id==="pTabInfo");
  document.getElementById("pTabListings").classList.toggle("active", id==="pTabListings");
}

let profileMapPicker = null;
let profileLocation = null;

function renderProfileInfoTab(u){
  profileMapPicker = null;
  profileLocation = (u.latitude && (u.latitude!==0 || u.longitude!==0)) ? {lat:u.latitude, lng:u.longitude} : null;
  const body = document.getElementById("profileBody");
  body.innerHTML = `
    <div class="form-shell">
      <div class="two-col">
        <div class="field"><label>Имя</label><input type="text" id="editFirst" value="${escapeHtml(u.first_name||"")}"></div>
        <div class="field"><label>Фамилия</label><input type="text" id="editLast" value="${escapeHtml(u.last_name||"")}"></div>
      </div>
      <div class="field"><label>Email</label><input type="email" id="editEmail" value="${escapeHtml(u.email||"")}"></div>
      <div class="field"><label class="check-row"><input type="checkbox" id="editSeller" ${u.is_seller?"checked":""}> Продаю товары на площадке</label></div>
      <div id="editLocationWrap" class="${u.is_seller?"":"hidden"}">${locationFieldMarkup("profMap", "profCoordReadout")}</div>
      <div id="profErr"></div>
      <div class="form-actions">
        <button class="btn primary" id="saveProfile">Сохранить</button>
        <button class="btn danger" id="delAccount">Удалить аккаунт</button>
      </div>
    </div>
  `;
  const sellerCheck = document.getElementById("editSeller");
  const locWrap = document.getElementById("editLocationWrap");
  function ensureMap(){
    if(profileMapPicker){ profileMapPicker.invalidate(); return; }
    profileMapPicker = createMapPicker("profMap", "profCoordReadout",
      profileLocation ? profileLocation.lat : 0, profileLocation ? profileLocation.lng : 0,
      (p)=>{ profileLocation = p; });
  }
  if(u.is_seller) ensureMap();
  sellerCheck.addEventListener("change", ()=>{
    locWrap.classList.toggle("hidden", !sellerCheck.checked);
    if(sellerCheck.checked) ensureMap();
  });

  document.getElementById("saveProfile").onclick = async ()=>{
    const errBox = document.getElementById("profErr");
    errBox.innerHTML = "";
    const wantsSeller = document.getElementById("editSeller").checked;
    if(wantsSeller && !profileLocation){
      errBox.innerHTML = `<div class="banner error">Укажите местоположение на карте, чтобы продавать товары.</div>`;
      return;
    }
    const payload = {
      first_name: document.getElementById("editFirst").value.trim(),
      last_name: document.getElementById("editLast").value.trim(),
      email: document.getElementById("editEmail").value.trim(),
      is_seller: wantsSeller,
    };
    if(wantsSeller && profileLocation){ payload.latitude = profileLocation.lat; payload.longitude = profileLocation.lng; }
    const btn = document.getElementById("saveProfile");
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try{
      await apiFetch("/api/user/"+encodeURIComponent(u.username)+"/", {
        method:"PATCH", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)
      });
      state.me = null;
      toast("Профиль обновлён", "ok");
      if(profileMapPicker){ try{ profileMapPicker.destroy(); }catch(e){} profileMapPicker = null; }
      renderProfile(u.username);
    }catch(e){
      errBox.innerHTML = `<div class="banner error">${escapeHtml(e.message)}</div>`;
    }finally{
      btn.disabled = false; btn.textContent = "Сохранить";
    }
  };
  document.getElementById("delAccount").onclick = ()=>{
    confirmDialog("Удалить аккаунт?", "Все ваши данные будут удалены без возможности восстановления.", async ()=>{
      try{
        await apiFetch("/api/user/"+encodeURIComponent(u.username)+"/", {method:"DELETE"});
        toast("Аккаунт удалён", "ok");
        logout();
      }catch(e){ toast(e.message, "err"); }
    });
  };
}

async function renderProfileListingsTab(username, isMine){
  const body = document.getElementById("profileBody");
  body.innerHTML = `<div class="grid" id="userListings"></div>`;
  loadUserListings(username, "userListings", isMine);
}

async function loadUserListings(username, containerId, isMine){
  const container = document.getElementById(containerId);
  container.innerHTML = Array.from({length:4}).map(()=>'<div class="sk"></div>').join("");
  try{
    let url = "/api/product/";
    const all = [];
    let next = url;
    let guard = 0;
    while(next && guard < 25){
      const data = await apiFetch(next);
      const results = Array.isArray(data) ? data : data.results;
      all.push(...results.filter(p => p.user && p.user.username === username));
      next = Array.isArray(data) ? null : data.next;
      guard++;
      if(!Array.isArray(data) && data.next == null) break;
    }
    container.innerHTML = "";
    container.className = "grid";
    if(all.length === 0){
      container.className = "";
      container.innerHTML = `<div class="empty"><div class="big">${isMine ? "У вас пока нет объявлений" : "Пока нет объявлений"}</div>
        <p>${isMine ? "Разместите первый товар — это займёт меньше минуты." : ""}</p>
        ${isMine ? '<button class="btn primary" id="firstSell" style="margin-top:14px;">Разместить объявление</button>' : ""}
      </div>`;
      if(isMine){
        const b = document.getElementById("firstSell");
        if(b) b.onclick = ()=> navigate("sell");
      }
      return;
    }
    for(const p of all){ container.appendChild(productCard(p)); }
  }catch(e){
    container.innerHTML = `<div class="err"><div class="big">Не удалось загрузить объявления</div><p>${escapeHtml(e.message)}</p></div>`;
  }
}

})();
